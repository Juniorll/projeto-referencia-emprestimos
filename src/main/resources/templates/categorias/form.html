<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <!-- O mesmo formulário serve para cadastrar (id vazio) e para editar (id preenchido) -->
    <h1 class="h4 mb-3" th:text="${categoria.id == null} ? 'Nova categoria' : 'Editar categoria'">Nova categoria</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- th:object liga o formulário ao objeto "categoria"; *{campo} = um atributo desse objeto -->
            <form th:action="@{/categorias/salvar}" th:object="${categoria}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nome">Nome *</label>
                        <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">Erro</div>
                    </div>
                </div>
                <p class="text-muted small mt-3 mb-0">* Campos obrigatórios</p>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-app"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
