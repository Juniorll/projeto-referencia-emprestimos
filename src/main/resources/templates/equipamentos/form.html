<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Equipamentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu}"></nav>

<main class="container py-4">
    <!-- O mesmo formulário serve para cadastrar (id vazio) e para editar (id preenchido) -->
    <h1 class="h4 mb-3" th:text="${equipamento.id == null} ? 'Novo equipamento' : 'Editar equipamento'">Novo equipamento</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <!-- th:object liga o formulário ao objeto "equipamento"; *{campo} = um atributo desse objeto -->
            <form th:action="@{/equipamentos/salvar}" th:object="${equipamento}" method="post" novalidate>
                <input type="hidden" th:field="*{id}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="patrimonio">Patrimônio *</label>
                        <input type="text" class="form-control" th:field="*{patrimonio}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('patrimonio')}" th:errors="*{patrimonio}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="descricao">Descrição *</label>
                        <input type="text" class="form-control" th:field="*{descricao}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="marca">Marca</label>
                        <input type="text" class="form-control" th:field="*{marca}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}">Erro</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="dataAquisicao">Aquisição *</label>
                        <input type="date" class="form-control" th:field="*{dataAquisicao}" th:errorclass="is-invalid">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('dataAquisicao')}" th:errors="*{dataAquisicao}">Erro</div>
                    </div>
                </div>
                <p class="text-muted small mt-3 mb-0">* Campos obrigatórios</p>
                <div class="mt-3 d-flex gap-2">
                    <button type="submit" class="btn btn-app"><i class="bi bi-check-lg"></i> Salvar</button>
                    <a th:href="@{/equipamentos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
